services:
  - type: web
    name: zeo-bid
    runtime: docker
    dockerfilePath: services/bid/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: AUCTION_SERVICE_URL
        sync: false
      - key: PRICING_SERVICE_URL
        sync: false
      - key: PRICING_MODE
        value: http
      - key: BID_PUBLISHER
        value: kafka
      - key: BIDDER_ALIAS_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
