# Render blueprint (owner: Ayush, #97, #98). The deployment artefact of record (SDD 3.1.1, FR-INFRA-4).
#
# Plan 6 adds the escrow-sweep cron (#97).
# Plan 7 adds every other service and environment groups (#98).
#
# First-time setup:
#   1. Render dashboard -> New -> Blueprint -> select this repository.
#   2. Enter the secret values for the external Neon, Aiven, Upstash and storage services.
#   3. Apply infra/postgres/init/*.sql to Neon and run infra/kafka/create-topics.sh
#      from a machine that can reach Aiven Kafka.
#
# Instance note: use the paid tier through the final demo so services don't spin down.
# The 8 vCPU / 16 GB dedicated host for load testing is provisioned separately.

envVarGroups:
  - name: zeo-shared
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - name: zeo-upstash
    envVars:
      - key: REDIS_URL
        sync: false

  - name: zeo-razorpay
    envVars:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - name: zeo-storage
    envVars:
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_KYC
        value: kyc-documents
      - key: S3_BUCKET_IMAGES
        value: auction-images

services:
  # ------------------------------------------------------------------ Infrastructure

  # ------------------------------------------------------------------ Cron

  - type: cron
    name: zeo-escrow-sweep
    runtime: docker
    dockerfilePath: ./services/escrow-sweep/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    # Every minute — idempotent; overlapping runs are safe (ADR-0006, AC-12).
    schedule: "* * * * *"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PAYMENT_SERVICE_URL
        value: http://zeo-payment-escrow:8000
      - key: INTERNAL_SERVICE_TOKEN
        sync: false

  # ------------------------------------------------------------------ API services

  - type: web
    name: zeo-auth-user
    runtime: docker
    dockerfilePath: ./services/auth-user/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVarGroups:
      - zeo-shared
      - zeo-upstash
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: REPOSITORY
        value: postgres
      - key: PYTHON_ENV
        value: production

  - type: web
    name: zeo-kyc
    runtime: docker
    dockerfilePath: ./services/kyc/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVarGroups:
      - zeo-shared
      - zeo-storage
      - zeo-upstash
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REPOSITORY
        value: postgres
      - key: PYTHON_ENV
        value: production

  - type: web
    name: zeo-auction-orchestrator
    runtime: docker
    dockerfilePath: ./services/auction-orchestrator/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVarGroups:
      - zeo-shared
      - zeo-upstash
      - zeo-storage
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PAYMENT_SERVICE_URL
        value: http://zeo-payment-escrow:8000
      - key: REPOSITORY
        value: postgres
      - key: PYTHON_ENV
        value: production

  - type: web
    name: zeo-bid
    runtime: docker
    dockerfilePath: ./services/bid/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVarGroups:
      - zeo-shared
      - zeo-upstash
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUCTION_SERVICE_URL
        value: http://zeo-auction-orchestrator:8000
      - key: PRICING_SERVICE_URL
        value: http://zeo-pricing:8000
      - key: REPOSITORY
        value: postgres
      - key: PYTHON_ENV
        value: production

  - type: web
    name: zeo-bid-flusher
    runtime: docker
    dockerfilePath: ./services/bid-flusher/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVarGroups:
      - zeo-shared
      - zeo-upstash
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REPOSITORY
        value: postgres
      - key: PYTHON_ENV
        value: production

  - type: web
    name: zeo-pricing
    runtime: docker
    dockerfilePath: ./services/pricing/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVarGroups:
      - zeo-shared
      - zeo-upstash
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REPOSITORY
        value: postgres
      - key: PYTHON_ENV
        value: production

  - type: web
    name: zeo-payment-escrow
    runtime: docker
    dockerfilePath: ./services/payment-escrow/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVarGroups:
      - zeo-shared
      - zeo-razorpay
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REPOSITORY
        value: postgres
      - key: PAYMENT_PORT
        value: razorpay
      - key: PYTHON_ENV
        value: production

  - type: web
    name: zeo-fraud-detector
    runtime: docker
    dockerfilePath: ./services/fraud-detector/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVarGroups:
      - zeo-shared
      - zeo-upstash
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CONSUME_BIDS
        value: "true"
      - key: ALERT_PUBLISHER
        value: kafka
      - key: ALERT_REPOSITORY
        value: postgres
      - key: PYTHON_ENV
        value: production

  - type: web
    name: zeo-dispute
    runtime: docker
    dockerfilePath: ./services/dispute/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVarGroups:
      - zeo-shared
      - zeo-storage
      - zeo-upstash
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PAYMENT_SERVICE_URL
        value: http://zeo-payment-escrow:8000
      - key: REPOSITORY
        value: postgres
      - key: PYTHON_ENV
        value: production

  - type: web
    name: zeo-search-analytics
    runtime: docker
    dockerfilePath: ./services/search-analytics/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVarGroups:
      - zeo-shared
      - zeo-upstash
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PAYMENT_SERVICE_URL
        value: http://zeo-payment-escrow:8000
      - key: REPOSITORY
        value: postgres
      - key: PYTHON_ENV
        value: production

  - type: web
    name: zeo-admin-moderation
    runtime: docker
    dockerfilePath: ./services/admin-moderation/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVarGroups:
      - zeo-shared
      - zeo-upstash
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REPOSITORY
        value: postgres
      - key: PYTHON_ENV
        value: production

  - type: web
    name: zeo-ws-gateway
    runtime: docker
    dockerfilePath: ./services/ws-gateway/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVarGroups:
      - zeo-shared
      - zeo-upstash
    envVars:
      - key: PYTHON_ENV
        value: production

  # ------------------------------------------------------------------ Public API and WebSocket gateway

  - type: web
    name: zeo-api-gateway
    runtime: docker
    dockerfilePath: ./infra/nginx/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: AUTH_USER_HOST
        value: zeo-auth-user
      - key: KYC_HOST
        value: zeo-kyc
      - key: AUCTION_HOST
        value: zeo-auction-orchestrator
      - key: BID_HOST
        value: zeo-bid
      - key: PRICING_HOST
        value: zeo-pricing
      - key: PAYMENT_HOST
        value: zeo-payment-escrow
      - key: DISPUTE_HOST
        value: zeo-dispute
      - key: SEARCH_HOST
        value: zeo-search-analytics
      - key: ADMIN_HOST
        value: zeo-admin-moderation
      - key: WS_GATEWAY_HOST
        value: zeo-ws-gateway

  # ------------------------------------------------------------------ Frontend

  - type: web
    name: zeo-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    rootDir: frontend
    envVars:
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
      - key: VITE_FEATURED_AUCTIONS
        sync: false
