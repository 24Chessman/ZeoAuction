# ZeoAuction stack configured for production external services (NeonDB, Upstash Redis, Aiven Kafka)
#
# Host ports: services 8001-8012 (http://localhost:<port>/healthz), S3 API 8333.
# Local postgres, redis, kafka are in the "local-infra" profile.

name: zeoauction

x-service-build: &service-build
  context: .

x-service-common: &service-common
  restart: unless-stopped
  depends_on:
    s3-init:
      condition: service_completed_successfully

x-service-env: &service-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REDIS_URL: ${REDIS_URL:-rediss://default:gQAAAAAAAlgFAAIgcDEwMGU0NmQ5MTJiZDg0MGNhODRkNzViM2U0MjgyZTViZA@fond-eagle-153605.upstash.io:6379}
  UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-https://fond-eagle-153605.upstash.io}
  UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-gQAAAAAAAlgFAAIgcDEwMGU0NmQ5MTJiZDg0MGNhODRkNzViM2U0MjgyZTViZA}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-veldo-berasagar9800-74f6.g.aivencloud.com:25533}
  KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_SSL}
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-avnadmin}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-AVNS_qiQ5Z7tYgpMehWhggET}
  KAFKA_SSL_CA_FILE: ${KAFKA_SSL_CA_FILE:-}
  S3_ENDPOINT_URL: http://s3:8333
  S3_ACCESS_KEY: zeo-dev-access
  S3_SECRET_KEY: zeo-dev-secret
  PAYMENT_ADAPTER: ${PAYMENT_ADAPTER:-razorpay}
  JWT_SECRET: ${JWT_SECRET:-zeo-dev-jwt-secret-not-for-production-use}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}

services:
  # ---------------------------------------------------------------- local infra (profile: local-infra)
  postgres:
    profiles: ["local-infra"]
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zeoauction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/seed:/seed:ro
      - ./infra/postgres/verify-guards.sql:/verify/verify-guards.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zeoauction"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    profiles: ["local-infra"]
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    profiles: ["local-infra"]
    image: apache/kafka:3.8.1
    restart: unless-stopped
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
      - ./infra/kafka:/opt/zeo:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-init:
    profiles: ["local-infra"]
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka:/opt/zeo:ro
    entrypoint: ["sh", "/opt/zeo/create-topics.sh", "kafka:9092"]
    restart: "no"

  # S3-compatible object storage
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3-identities.json
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./infra/s3/s3-identities.json:/etc/seaweedfs/s3-identities.json:ro
      - ./infra/s3/security.toml:/etc/seaweedfs/security.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8333/"]
      interval: 5s
      timeout: 5s
      retries: 30

  s3-init:
    image: amazon/aws-cli:2.27.0
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: zeo-dev-access
      AWS_SECRET_ACCESS_KEY: zeo-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT_URL: http://s3:8333
    volumes:
      - ./infra/s3:/opt/zeo:ro
    entrypoint: ["sh", "/opt/zeo/create-buckets.sh"]
    restart: "no"

  # Distributed tracing with Jaeger (#101)
  jaeger:
    image: jaegertracing/all-in-one:1.50
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ---------------------------------------------------------------- application services
  auth-user:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/auth-user/Dockerfile }
    ports: ["8001:8000"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=auth
      DATABASE_SCHEMA: auth
      AUTH_ACCEPT_SEED_PASSWORD: "true"
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

  kyc:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/kyc/Dockerfile }
    ports: ["8002:8000"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=kyc
      DATABASE_SCHEMA: kyc
      S3_BUCKET: kyc-documents
      S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
      KYC_SIGNED_URL_TTL_SECONDS: "60"
      KYC_EXTRA_TRUSTED_CERTS: ${KYC_EXTRA_TRUSTED_CERTS:-}
      KYC_AADHAAR_MAX_AGE_HOURS: "0"
    volumes:
      - ./services/kyc/dev-certs:/srv/dev-certs:ro

  auction-orchestrator:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/auction-orchestrator/Dockerfile }
    ports: ["8003:8000"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=auction
      DATABASE_SCHEMA: auction
      S3_BUCKET: listing-images
      AUCTION_PUBLISHER: kafka
      CONSUME_BID_EVENTS: "true"
      CHECK_TOKEN_FRESHNESS: "true"
      RUN_LIFECYCLE_TIMER: "true"
      DRAIN_GRACE_SECONDS: "5"
      PAYMENT_SERVICE_URL: http://payment-escrow:8000
      SETTLE_ORDERS: "true"
      CONSUME_PAYMENT_EVENTS: "true"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-zeo-dev-internal-token-not-for-production}

  bid:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/bid/Dockerfile }
    ports: ["8004:8000"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=bid
      DATABASE_SCHEMA: bid
      AUCTION_SERVICE_URL: http://auction-orchestrator:8000
      PRICING_SERVICE_URL: http://pricing:8000
      PRICING_MODE: http
      BID_PUBLISHER: kafka
      STUB_FUNDS_LIMIT: "100000.00"

  pricing:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/pricing/Dockerfile }
    ports: ["8005:8000"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=pricing
      DATABASE_SCHEMA: pricing
      CONSUME_BID_EVENTS: "true"

  payment-escrow:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/payment-escrow/Dockerfile }
    ports: ["8006:8000"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=payment
      DATABASE_SCHEMA: payment
      PAYMENT_PUBLISHER: kafka
      RUN_SETTLEMENT_WORKER: "true"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_LINKED_ACCOUNT: ${RAZORPAY_LINKED_ACCOUNT:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-zeo-dev-internal-token-not-for-production}

  dispute:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/dispute/Dockerfile }
    ports: ["8007:8000"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=dispute
      DATABASE_SCHEMA: dispute
      DISPUTE_REPOSITORY: postgres
      S3_BUCKET: dispute-evidence
      PAYMENT_SERVICE_URL: http://payment-escrow:8000

  search-analytics:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/search-analytics/Dockerfile }
    ports: ["8008:8000"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=search
      DATABASE_SCHEMA: search
      SEARCH_REPOSITORY: postgres

  admin-moderation:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/admin-moderation/Dockerfile }
    ports: ["8009:8000"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=admin
      DATABASE_SCHEMA: admin
      ADMIN_REPOSITORY: postgres

  ws-gateway:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/ws-gateway/Dockerfile }
    ports: ["8010:8000"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=notify
      DATABASE_SCHEMA: notify
      WS_CONSUMER_GROUP: ws-gateway-prod-1
      WS_CONSUME_EVENTS: "true"

  # ---------------------------------------------------------------- workers and cron
  fraud-detector:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/fraud-detector/Dockerfile }
    ports: ["8011:8000"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=fraud
      DATABASE_SCHEMA: fraud
      CONSUME_BID_EVENTS: "true"
      FRAUD_ALERT_PUBLISHER: kafka
      FRAUD_ALERT_REPOSITORY: postgres
      FRAUD_ALERT_THRESHOLD: ${FRAUD_ALERT_THRESHOLD:-0.6}

  bid-flusher:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/bid-flusher/Dockerfile }
    ports: ["8012:8000"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=bid
      DATABASE_SCHEMA: bid
      FLUSH_BATCH_MAX_SIZE: "500"
      FLUSH_BATCH_MAX_AGE_MS: "500"
      REPLAY_ON_START: "true"

  escrow-sweep:
    <<: *service-common
    build: { <<: *service-build, dockerfile: services/escrow-sweep/Dockerfile }
    entrypoint: ["sh", "-c", "while true; do python -m app.sweep; sleep 60; done"]
    environment:
      <<: *service-env
      DATABASE_URL: ${NEON_DB_CONNECTION_STRING:-${DATABASE_URL}}&currentSchema=payment
      DATABASE_SCHEMA: payment
      PAYMENT_SERVICE_URL: http://payment-escrow:8000

volumes:
  pgdata:
  kafkadata:
  s3data:
